<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KI-Agent Dashboard</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --gemini-blue: #1a73e8;
      --gemini-gradient: linear-gradient(135deg, #4285f4 0%, #9b51e0 50%, #d946ef 100%);
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      padding: 3rem 1.5rem; 
      max-width: 850px; 
      margin: 0 auto; 
    }
    
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 { 
      font-size: 2.2rem; 
      font-weight: 700;
      background: var(--gemini-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.subtitle { color: var(--text-muted); font-size: 1rem; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1.2rem;
    }

    .form-group { margin-bottom: 1.2rem; }
    
    label { 
      display: block; 
      font-size: 0.85rem; 
      color: var(--text-muted); 
      margin-bottom: 0.4rem; 
      font-weight: 600; 
    }
    
    input, textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #f1f5f9;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    input:focus, textarea:focus { 
      outline: none; 
      background: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    button {
      background: var(--gemini-gradient);
      color: #fff;
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.25);
    }

    button:hover { opacity: 0.95; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status { 
      margin-top: 1.2rem; 
      font-size: 0.9rem; 
      color: var(--gemini-blue); 
      font-weight: 600; 
      text-align: center;
    }

    .result-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    /* Login Screen Overlay */
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-card {
      max-width: 400px;
      width: 90%;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>

  <div id="loginOverlay">
    <div class="card login-card">
      <header style="margin-bottom: 1.5rem;">
        <h1>🔒 Anmelden</h1>
        <p class="subtitle">Zugriff nur für autorisierte Nutzer</p>
      </header>
      <div class="form-group">
        <label>Benutzername</label>
        <input type="text" id="usernameInput" placeholder="Benutzername">
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <input type="password" id="passwordInput" placeholder="Passwort">
      </div>
      <button onclick="checkLogin()">Einloggen</button>
      <p id="loginError" class="error-msg">Zugangsdaten falsch!</p>
    </div>
  </div>

  <div id="mainDashboard" style="display: none;">
    <header>
      <h1>✨ KI-Suchagent Dashboard</h1>
      <p class="subtitle">Willkommen, ProfessorFilou!</p>
    </header>

    <div class="card">
      <h3>🔍 Agenten-Auftrag</h3>
      
      <div class="form-group">
        <label>Suchbegriff / Thema</label>
        <input type="text" id="topic" value="Gebrauchte Mechanische Tastaturen">
      </div>
      
      <div class="form-group">
        <label>Detaillierte Kriterien & Präferenzen</label>
        <textarea id="details" rows="3">Suche nach Keychron Tastaturen unter 60 Euro in gutem Zustand.</textarea>
      </div>

      <button id="runBtn" onclick="runAgent()">Agenten jetzt starten ✨</button>
      <div id="statusText" class="status"></div>
    </div>

    <div class="card" id="resultCard" style="display: none;">
      <h3>📊 Agenten-Bericht</h3>
      <div class="result-box" id="resultContent"></div>
    </div>
  </div>

  <script>
    // 🔑 API Keys
    const FIRECRAWL_API_KEY = "fc-52fa692bf9fa46ae9bea663dd58a275d";
    const GROQ_API_KEY = "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";

    // 🔑 Passwort-Prüfung
    function checkLogin() {
      const user = document.getElementById('usernameInput').value;
      const pass = document.getElementById('passwordInput').value;
      const errorMsg = document.getElementById('loginError');

      if (user === "ProfessorFilou" && pass === "PFWAB") {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // 🤖 Agenten-Logik
    async function runAgent() {
      const topic = document.getElementById('topic').value.trim();
      const details = document.getElementById('details').value.trim();

      const statusText = document.getElementById('statusText');
      const resultCard = document.getElementById('resultCard');
      const resultContent = document.getElementById('resultContent');
      const btn = document.getElementById('runBtn');

      btn.disabled = true;
      resultCard.style.display = 'none';
      statusText.innerText = "🌐 Durchsuche das Web via Firecrawl...";

      try {
        // 1. Websuche
        const fcResponse = await fetch("https://api.firecrawl.dev/v1/search", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${FIRECRAWL_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ query: topic, limit: 3 })
        });

        const fcData = await fcResponse.json();
        if (!fcResponse.ok || !fcData.data) {
          throw new Error(fcData.error || "Fehler bei der Firecrawl-Suche");
        }

        statusText.innerText = "✨ Analysiere Treffer mit Groq...";

        // 2. Zusammenfassung
        const prompt = `
        Du bist ein intelligenter Such-Agent.
        Präferenzen des Nutzers: ${details}

        Hier sind die aktuellen Suchergebnisse aus dem Web:
        ${JSON.stringify(fcData.data)}

        Aufgabe:
        1. Prüfe, ob die Ergebnisse zu den Kriterien des Nutzers passen.
        2. Wenn relevante Treffer dabei sind, fasse sie kurz und präzise zusammen.
        3. Gib die passenden Links an.
        `;

        const groqResponse = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: "Du bist ein hilfreicher Assistent." },
              { role: "user", content: prompt }
            ]
          })
        });

        const groqData = await groqResponse.json();
        if (!groqResponse.ok) {
          throw new Error(groqData.error?.message || "Fehler bei Groq API");
        }

        const report = groqData.choices[0].message.content;

        // 3. Anzeige
        statusText.innerText = "✅ Fertiggestellt!";
        resultContent.innerText = report;
        resultCard.style.display = 'block';

      } catch (err) {
        statusText.innerText = "❌ Fehler: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
